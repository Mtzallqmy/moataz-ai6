name: Auto Pro UI Integration

on:
  push:
    branches:
      - agent/arabic-auto-ui
    paths:
      - .agent/apply_auto_ui.py
      - .github/workflows/agent-apply-auto-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Auto Pro integration
        shell: bash
        run: |
          set -euo pipefail
          python .agent/apply_auto_ui.py
          rm .agent/apply_auto_ui.py
          rmdir .agent 2>/dev/null || true
          rm .github/workflows/agent-apply-auto-ui.yml
          git diff --check

      - name: Commit integrated experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Arabic-first Auto and Pro experience"
          git push origin HEAD:agent/arabic-auto-ui
