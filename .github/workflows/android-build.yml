name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moataz-bootstrap-import
  cancel-in-progress: false

jobs:
  bootstrap-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/patch/patch-* > /tmp/moataz.patch.xz.b64
          base64 -d /tmp/moataz.patch.xz.b64 > /tmp/moataz.patch.xz
          echo "d1f7dcd82ac05c50cc759245ca9b7b615ef3928b1450f8e12cd418484cef967a  /tmp/moataz.patch.xz" | sha256sum -c -
          xz -dc /tmp/moataz.patch.xz > /tmp/moataz.patch

          cat .bootstrap/patch/dispatcher-* > /tmp/dispatcher.kt.xz.b64
          base64 -d /tmp/dispatcher.kt.xz.b64 > /tmp/dispatcher.kt.xz
          echo "9978488a3f5fc67fa953d6473df96a8ef3c827565edc5f692cdeda4b32f5ddeb  /tmp/dispatcher.kt.xz" | sha256sum -c -
          xz -dc /tmp/dispatcher.kt.xz > /tmp/ExternalAutomationDispatcher.kt

          cat .bootstrap/patch/newfiles-* > /tmp/moataz-new-files.tar.xz.b64
          base64 -d /tmp/moataz-new-files.tar.xz.b64 > /tmp/moataz-new-files.tar.xz
          echo "85136c5d476db32b57e8fdeb2ed23b8e01e56520f329485acbbc869980ae0598  /tmp/moataz-new-files.tar.xz" | sha256sum -c -
          tar -tJf /tmp/moataz-new-files.tar.xz >/dev/null

      - name: Import audited Moataz AI source tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=f8be99dc67888bedcbb837a190e5f8200f77ab8e

          # Keep the currently-authorized workflow files byte-for-byte unchanged
          # in this commit. Production workflows are installed separately after
          # the source import, avoiding GitHub App workflow-scope restrictions.
          git show HEAD:.github/workflows/android-build.yml > /tmp/bootstrap-android-build.yml
          git show HEAD:.github/workflows/bootstrap-import.yml > /tmp/bootstrap-import.yml

          git remote add upstream https://github.com/ExTV/rikkahub-agent.git 2>/dev/null || git remote set-url upstream https://github.com/ExTV/rikkahub-agent.git
          git fetch --no-tags upstream "$BASE"

          # Populate the upstream tree while keeping the current bootstrap commit
          # as the parent. This makes the final push a normal fast-forward commit.
          git read-tree --reset -u "$BASE"

          git apply --check /tmp/moataz.patch
          git apply /tmp/moataz.patch
          rm -f app/src/main/res/mipmap-{h,m,x,xx,xxx}dpi/ic_launcher*.png docs/icon.png || true
          cp /tmp/ExternalAutomationDispatcher.kt app/src/main/java/me/rerere/rikkahub/automation/ExternalAutomationDispatcher.kt
          tar -xJf /tmp/moataz-new-files.tar.xz

          # Keep workflows unchanged for this GitHub-token push.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap-android-build.yml .github/workflows/android-build.yml
          cp /tmp/bootstrap-import.yml .github/workflows/bootstrap-import.yml

          grep -q 'applicationId = "ai.moataz"' app/build.gradle.kts
          grep -q 'rootProject.name = "moataz-ai"' settings.gradle.kts
          grep -q 'Moataz AI' README.md
          test -f ai/src/main/java/me/rerere/ai/provider/ApiKeyPool.kt
          test -f app/src/main/res/drawable/moataz_ai_mark.xml
          test -z "$(git diff HEAD -- .github/workflows)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish Moataz AI v0.1 source"
          git push origin main
