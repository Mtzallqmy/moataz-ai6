name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAVA_VERSION: "17"
      MOATAZ_KEYSTORE_BASE64: ${{ secrets.MOATAZ_KEYSTORE_BASE64 }}
      MOATAZ_KEYSTORE_PASSWORD: ${{ secrets.MOATAZ_KEYSTORE_PASSWORD }}
      MOATAZ_KEY_ALIAS: ${{ secrets.MOATAZ_KEY_ALIAS }}
      MOATAZ_KEY_PASSWORD: ${{ secrets.MOATAZ_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37
            build-tools;36.0.0
            cmake;3.22.1
            ndk;28.2.13676358

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Web UI typecheck
        working-directory: web-ui
        run: pnpm run typecheck

      - name: Configure release signing
        if: >-
          env.MOATAZ_KEYSTORE_BASE64 != '' &&
          env.MOATAZ_KEYSTORE_PASSWORD != '' &&
          env.MOATAZ_KEY_ALIAS != '' &&
          env.MOATAZ_KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          printf '%s' "$MOATAZ_KEYSTORE_BASE64" | base64 --decode > .ci/moataz-release.jks
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/.ci/moataz-release.jks"
            printf 'storePassword=%s\n' "$MOATAZ_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$MOATAZ_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$MOATAZ_KEY_PASSWORD"
          } > local.properties
          chmod 600 .ci/moataz-release.jks local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :ai:testDebugUnitTest :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build Release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: moataz-ai-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: moataz-ai-release-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v7
        with:
          name: moataz-ai-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean signing material
        if: always()
        run: rm -rf .ci local.properties
