name: Agent Runtime Integration

on:
  push:
    branches:
      - agent/agent-runtime
    paths:
      - .agent/apply_agent_runtime.py
      - .github/workflows/agent-apply-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply runtime integration
        shell: bash
        run: |
          set -euo pipefail
          python .agent/apply_agent_runtime.py
          rm .agent/apply_agent_runtime.py
          rmdir .agent 2>/dev/null || true
          rm .github/workflows/agent-apply-runtime.yml
          git diff --check

      - name: Commit integrated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route generation through AgentRuntime"
          git push origin HEAD:agent/agent-runtime
