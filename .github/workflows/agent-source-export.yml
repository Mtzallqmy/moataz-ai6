name: Agent Source Export

on:
  push:
    branches:
      - agent/auto-source-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pack source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='**/build' \
            --exclude='node_modules' \
            -czf moataz-ai-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: moataz-ai-source-snapshot
          path: moataz-ai-source.tar.gz
          if-no-files-found: error
          retention-days: 1
