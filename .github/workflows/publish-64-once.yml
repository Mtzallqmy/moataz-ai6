name: Publish Verified Android 8 Arm64 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-64-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.64
      ARTIFACT_ID: "9122404361"
      APK_NAME: moataz-ai-v0.0.64-android8-arm64.apk
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/moataz-release.zip
          unzip -q /tmp/moataz-release.zip -d release-artifacts
          test -s "release-artifacts/${APK_NAME}"
          ls -lh release-artifacts

      - name: Verify signed arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="release-artifacts/${APK_NAME}"
          jarsigner -verify "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "APK contains an unexpected non-arm64 native ABI" >&2
            exit 1
          fi
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Create or update v0.0.64 release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target c569cc4f8e869c57d41d53dd55c7fd655fcdfd02 \
              --title "Moataz AI v0.0.64" \
              --notes "Moataz AI v0.0.64\n\n- Android 8.0+ (API 26+)\n- arm64-v8a\n- Signed install APK\n- applicationId: ai.moataz" \
              release-artifacts/*
          fi

      - name: Remove one-shot publisher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-64-once.yml
          git commit -m "ci: remove one-shot release publisher"
          git push origin HEAD:main
