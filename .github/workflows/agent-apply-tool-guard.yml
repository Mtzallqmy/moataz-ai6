name: Tool Capability Guard

on:
  push:
    branches:
      - agent/arabic-auto-ui
    paths:
      - .agent/apply_tool_capability_guard.py
      - .github/workflows/agent-apply-tool-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply tool capability guard
        shell: bash
        run: |
          set -euo pipefail
          python .agent/apply_tool_capability_guard.py
          rm .agent/apply_tool_capability_guard.py
          rmdir .agent 2>/dev/null || true
          rm .github/workflows/agent-apply-tool-guard.yml
          git diff --check
      - name: Commit guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: guard runtime tools by model capability"
          git push origin HEAD:agent/arabic-auto-ui
