name: Agent Apply Patch

on:
  push:
    branches:
      - agent/auto-source-runtime
    paths:
      - .agent/pending.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply pending patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent/pending.patch ]]; then
            echo "No pending patch; nothing to apply."
            exit 0
          fi
          cp .agent/pending.patch "$RUNNER_TEMP/pending.patch"
          git apply --check "$RUNNER_TEMP/pending.patch"
          git apply "$RUNNER_TEMP/pending.patch"
          rm .agent/pending.patch
          rmdir .agent 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate auto source tool routing"
          git push origin HEAD:agent/auto-source-runtime
